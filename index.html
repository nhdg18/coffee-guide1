<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Ten classic coffees painted as watercolour glasses, with every layer of espresso, water, milk and foam labelled.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: one horizontal track of full-height poster panels, one watercolour glass per panel, hover for its story */
:root{
  --paper:#F3EDE3;
  --sky:#BCD0E8;
  --blush:#F3D7D8;
  --card:#FBF7F0;
  --ink:#17130F;
  --ink-soft:#5A5047;
  --accent:#D63E1C;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  --top:calc(64px + env(safe-area-inset-top,0px));
  --bottom:calc(84px + env(safe-area-inset-bottom,0px));
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;opacity:.32;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42 0 0 0 0 .36 0 0 0 0 .3 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
button{font:inherit;color:inherit}
:focus-visible{outline:2px dashed var(--accent);outline-offset:4px}

/* top bar */
.topbar{position:fixed;inset:0 0 auto;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px),3vw);padding-right:max(16px,env(safe-area-inset-right,0px),3vw)}
.brand{font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block}
.hint{font-family:var(--hand);font-size:22px;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
.hint svg{width:46px;height:14px}
.index-wrap{position:relative}
.index-btn{background:none;border:0;cursor:pointer;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:6px 0}
.index-list{position:absolute;right:0;top:calc(100% + 8px);background:var(--card);list-style:none;margin:0;padding:10px 6px;min-width:220px;
  border:2px solid var(--ink);border-radius:255px 14px 225px 14px/14px 225px 14px 255px;box-shadow:4px 5px 0 rgba(23,19,15,.12)}
.index-list button{display:flex;width:100%;gap:12px;align-items:baseline;background:none;border:0;padding:7px 12px;cursor:pointer;text-align:left;font-size:15px}
.index-list button span{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;width:18px}
.index-list button:hover{color:var(--accent)}

/* track */
.track{position:fixed;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.panel{flex:0 0 76vw;height:100%;position:relative;display:flex;flex-direction:column;justify-content:center;
  padding-block:var(--top) var(--bottom);padding-left:max(16px,3vw);padding-right:max(16px,3vw);box-sizing:border-box}
.bg-paper{background:var(--paper)} .bg-sky{background:var(--sky)} .bg-blush{background:var(--blush)}

/* title */
.intro{flex-basis:64vw;gap:28px}
.intro h1{margin:0;font-size:clamp(72px,12vw,176px);line-height:.86;letter-spacing:-.045em;font-weight:700}
.intro h1 em{font-style:normal;color:var(--accent);display:block}
.intro p{margin:0;max-width:38ch;font-size:18px;line-height:1.45}
.intro .go{display:flex;align-items:center;gap:12px;font-family:var(--hand);font-size:30px;background:none;border:0;padding:0;cursor:pointer;width:max-content}
.intro .go svg{width:110px;height:30px}

/* drink panel */
.num{position:absolute;top:calc(var(--top) + 6px);left:max(16px,3vw);font-size:12px;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.stage{position:relative;display:flex;align-items:center;min-height:0;flex:1 1 auto}
.cup{background:none;border:0;padding:0;cursor:pointer;display:block;border-radius:30px;max-width:100%}
.cup svg{display:block;height:min(68vh,calc(100vh - 290px),760px);width:auto;max-width:100%;overflow:visible}
.vessel{transform-box:view-box;transform-origin:440px 548px;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.drink.open .vessel{transform:rotate(-3deg)}
.lbl{font-family:var(--hand);font-size:calc(31px * var(--k,1));font-weight:500;fill:var(--ink)}
.lbl .pct{font-size:calc(22px * var(--k,1));fill:var(--ink-soft)}
.labels{transition:opacity .5s}
.steam path{opacity:0;stroke-dasharray:60 140;stroke-dashoffset:60;transition:opacity .3s}
.drink.open .steam path{opacity:1;animation:steam 2.4s ease-in-out infinite}
.drink.open .steam path:nth-child(2){animation-delay:.5s}
.drink.open .steam path:nth-child(3){animation-delay:1s}
@keyframes steam{0%{stroke-dashoffset:60;opacity:0}30%{opacity:1}100%{stroke-dashoffset:-140;opacity:0}}

.meta{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 28px;margin-top:4px}
.meta h2{margin:0;font-size:clamp(46px,6.2vw,92px);line-height:.92;letter-spacing:-.04em;font-weight:700;text-wrap:balance}
.meta .sub{display:flex;flex-direction:column;gap:2px;padding-bottom:8px}
.recipe{margin:0;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.caption{margin:0;font-family:var(--hand);font-size:27px;color:var(--ink-soft);line-height:1.1}

.card{position:absolute;right:0;top:50%;width:min(340px,38%);box-sizing:border-box;padding:22px 24px 18px;background:var(--card);color:var(--ink);
  border:2px solid var(--ink);border-radius:255px 14px 225px 14px/14px 225px 14px 255px;box-shadow:5px 6px 0 rgba(23,19,15,.1);
  opacity:0;pointer-events:none;transform:translateY(-44%) rotate(1.6deg);transition:opacity .25s ease,transform .25s ease;z-index:5}
.drink.open .card{opacity:1;pointer-events:auto;transform:translateY(-50%) rotate(1.6deg)}
.card .tag{margin:0 0 10px;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.card .story{margin:0;font-size:16px;line-height:1.5}
.card .fact{margin:12px 0 0;font-family:var(--hand);font-size:24px;line-height:1.1;color:var(--accent)}
.tap-hint{display:none}

/* closing */
.outro{flex-basis:70vw;gap:26px}
.outro h2{margin:0;font-size:clamp(46px,6vw,88px);letter-spacing:-.04em;line-height:.92}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 18px;max-width:760px;margin:0;padding:0;list-style:none}
.swatches li{display:flex;align-items:center;gap:10px;font-family:var(--hand);font-size:26px}
.swatches svg{width:46px;height:40px;flex:none}
.credits{max-width:62ch;font-size:12px;line-height:1.5;color:var(--ink-soft);margin:0}
.back{font-family:var(--hand);font-size:28px;background:none;border:0;padding:0;cursor:pointer;width:max-content;color:var(--accent)}

/* progress */
.progress{position:fixed;inset:auto 0 0;z-index:30;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px),3vw);padding-right:max(16px,env(safe-area-inset-right,0px),3vw)}
.rail{position:relative;height:30px}
.rail::before{content:"";position:absolute;left:0;right:0;top:9px;height:1.5px;background:var(--ink);opacity:.55}
.tick{position:absolute;top:0;transform:translateX(-50%);background:none;border:0;padding:0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.tick::before{content:"";width:1.5px;height:12px;background:var(--ink);margin-top:4px}
.tick span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;color:var(--ink-soft)}
.tick:hover span,.tick.on span{color:var(--ink)}
.dot{position:absolute;top:4px;width:13px;height:13px;border-radius:50%;background:var(--accent);transform:translateX(-50%);pointer-events:none}
.foot{display:flex;justify-content:space-between;gap:16px;font-size:11px;letter-spacing:.06em;color:var(--ink-soft);margin-top:4px}
.foot b{color:var(--ink);font-weight:500}

@media (max-width:1199px){
  .panel{flex-basis:88vw}
  .card{width:min(340px,46%)}
  .tick span{display:none}
}
@media (max-width:767px){
  :root{--top:calc(58px + env(safe-area-inset-top,0px))}
  .panel,.intro,.outro{flex-basis:100vw}
  .hint{display:none}
  .cup svg{width:100%;height:auto;max-height:58vh}
  .stage{justify-content:center}
  .card{left:0;right:0;top:auto;bottom:0;width:auto;transform:translateY(12px) rotate(.8deg)}
  .drink.open .card{transform:translateY(0) rotate(.8deg)}
  .tap-hint{display:block;position:absolute;right:0;top:0;font-family:var(--hand);font-size:22px;color:var(--ink-soft)}
  .drink:not(.first) .tap-hint{display:none}
  .intro h1{font-size:clamp(64px,22vw,120px)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .drink.open .vessel{transform:none}
}
</style>
</head><body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="wc" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="4" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="9" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.3" result="b"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" seed="11" result="blot"/>
      <feColorMatrix in="blot" type="matrix" values="0.22 0.22 0.22 0 0.64  0.22 0.22 0.22 0 0.64  0.22 0.22 0.22 0 0.64  0 0 0 0 1" result="bg"/>
      <feBlend in="b" in2="bg" mode="multiply" result="m1"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="2" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0.16 0.16 0.16 0 0.8  0.16 0.16 0.16 0 0.8  0.16 0.16 0.16 0 0.8  0 0 0 0 1" result="gg"/>
      <feBlend in="m1" in2="gg" mode="multiply" result="m2"/>
      <feComposite in="m2" in2="b" operator="in"/>
    </filter>
    <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="shadow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
    <linearGradient id="shade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2a160b" stop-opacity=".30"/>
      <stop offset=".16" stop-color="#2a160b" stop-opacity=".06"/>
      <stop offset=".3" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".78" stop-color="#2a160b" stop-opacity=".04"/>
      <stop offset="1" stop-color="#2a160b" stop-opacity=".32"/>
    </linearGradient>
  </defs>
</svg>

<header class="topbar">
  <button class="brand" type="button" data-go="0"><i aria-hidden="true"></i>Coffee Guide</button>
  <div class="hint" aria-hidden="true">scroll to pour
    <svg viewBox="0 0 46 14"><path d="M1 8 C12 5 26 9 42 6 M35 1 L43 6 L36 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div class="index-wrap">
    <button class="index-btn" id="index-btn" type="button" aria-expanded="false" aria-controls="index-list">Index</button>
    <ul class="index-list" id="index-list" hidden></ul>
  </div>
</header>

<main class="track" id="track" aria-label="Coffee drinks, scroll sideways">
  <section class="panel intro bg-paper" data-id="">
    <h1>Coffee<em>Guide</em></h1>
    <p>Ten classic coffees, painted as glasses you can see through. Every layer is labelled with its share of the cup. Hover a glass, or tap it, to read where the drink comes from.</p>
    <button class="go" type="button" data-go="1">scroll to pour
      <svg viewBox="0 0 110 30" aria-hidden="true"><path d="M2 17 C25 10 55 21 100 13 M88 4 L102 13 L90 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </section>
  <!-- drink panels are painted here -->
</main>

<footer class="progress" aria-label="Progress">
  <div class="rail" id="rail"><span class="dot" id="dot"></span></div>
  <div class="foot"><span>Watercolour glasses, painted in code</span><span id="where"><b>Start</b></span></div>
</footer>

<script>
(function(){
const DRINKS=[
 {id:"espresso",name:"Espresso",cup:"demi",fill:.5,recipe:"Pure coffee",caption:"rich, bold and intense",surface:"crema",note:"golden crema",
  layers:[["espresso",100]],tag:"Italy · 1884–1948",
  story:"Espresso was born in Turin, where Angelo Moriondo patented a steam-driven coffee machine in 1884. In Milan, Luigi Bezzera and Desiderio Pavoni refined the idea and showed it at the 1906 Milan Fair, making coffee “expressly” for each customer in under a minute. The thick golden crema we expect today only arrived in 1948, when Achille Gaggia’s lever machine pushed water through the grounds at far higher pressure.",
  fact:"no crema before 1948"},
 {id:"ristretto",name:"Ristretto",cup:"demi",fill:.36,recipe:"Short espresso",caption:"syrupy, sweet, concentrated",surface:"crema",note:"thick crema",
  layers:[["ristretto",100]],tag:"Italy · 20th century",
  story:"Ristretto means “restricted” in Italian: the same dose of ground coffee as an espresso, pulled with roughly half the water and stopped early. Because the shot ends before the slower, more bitter compounds dissolve, it tastes sweeter, thicker and more intense. It grew up alongside espresso in Italian bars as a way to push a shot toward sweetness, and today it is the base of many flat whites.",
  fact:"less water, not less coffee"},
 {id:"americano",name:"Americano",cup:"mug",fill:.86,recipe:"Espresso + water",caption:"long, clean and easygoing",surface:"water",
  layers:[["espresso",33],["water",67]],tag:"Italy · 1940s",
  story:"The story goes that American soldiers stationed in Italy during the Second World War found espresso too strong, so they topped it up with hot water to taste more like the drip coffee back home. Italians called the result caffè americano. Whether or not the legend is exact, the drink travelled the world with the espresso machine. Pour the shot over the water instead and Australians call it a long black.",
  fact:"espresso, stretched"},
 {id:"macchiato",name:"Macchiato",cup:"demi",fill:.7,recipe:"Espresso + milk foam",caption:"espresso with a spot of foam",surface:"dot",note:"the “stain”",
  layers:[["espresso",75],["foam",25]],tag:"Italy · 20th century",
  story:"Macchiato means “stained” or “marked”. In busy Italian bars, a spoonful of milk foam on top let the barista tell this cup apart from a plain espresso at a glance. It is still a small, strong drink: a single shot softened by a little foam, quite different from the large, sweet drinks that coffee chains sell under the same name.",
  fact:"a mark of foam"},
 {id:"cortado",name:"Cortado",cup:"picS",fill:.84,recipe:"Espresso + milk",caption:"cut with warm milk",surface:"heart",note:"latte art",
  layers:[["espresso",50],["milk",50]],tag:"Spain",
  story:"From the Spanish cortar, “to cut”, a cortado is espresso cut with an equal amount of warm milk, steamed with very little foam so it stays smooth. It is an everyday order across Spain, and Cuba’s cortadito adds sugar to the shot. Served in a small glass, it sits between a macchiato and a flat white: enough milk to soften the acidity, not enough to hide the coffee.",
  fact:"half and half, no fuss"},
 {id:"flat-white",name:"Flat White",cup:"pic",fill:.9,recipe:"Espresso + milk + microfoam",caption:"velvety and strong",surface:"tulip",note:"tulip pour",
  layers:[["espresso",35],["milk",55],["microfoam",10]],tag:"Australia / New Zealand · 1980s",
  story:"Both Australia and New Zealand claim the flat white. Sydney café owner Alan Preston says he put it on his menu in 1985, while Wellington barista Fraser McInnes tells of a cappuccino in 1989 that came out “flat”. Either way, it is espresso under a thin layer of velvety microfoam, stronger than a latte. Australian and New Zealand cafés carried it to London in the 2000s, and from there everywhere.",
  fact:"the great trans-Tasman debate"},
 {id:"cappuccino",name:"Cappuccino",cup:"bowl",fill:.92,recipe:"Espresso + milk + foam",caption:"smooth espresso with silky foam",surface:"cocoa",note:"cocoa dusting",
  layers:[["espresso",33],["milk",33],["foam",34]],tag:"Italy · 1930s",
  story:"The cappuccino takes its name from the Capuchin friars, whose brown-hooded robes matched the colour of coffee lightened with milk. Viennese cafés served a “Kapuziner” in the 1700s, but the foamy version we know arrived in Italy with the espresso machine in the early 20th century. Italians still treat it as a breakfast drink, and ordering one after lunch earns a raised eyebrow.",
  fact:"never after 11, if you’re in Rome"},
 {id:"latte",name:"Latte",cup:"picT",fill:.92,recipe:"Espresso + milk + milk foam",caption:"creamy milk with an espresso kick",surface:"rosetta",note:"rosetta",
  layers:[["espresso",20],["milk",70],["foam",10]],tag:"Italy / USA · 1950s–80s",
  story:"In Italy, caffellatte is simply coffee with milk, made at home for breakfast; ask a bar for “un latte” and you will get a glass of milk. The espresso-bar latte grew up in America. Lino Meiorin of Caffe Mediterraneum in Berkeley said he popularised it in the 1950s for customers who found cappuccino too strong, and Seattle’s coffee boom of the 1980s took it worldwide.",
  fact:"say “caffè latte” in Italy"},
 {id:"mocha",name:"Mocha",cup:"mug",fill:.9,recipe:"Espresso + hot chocolate + milk + foam",caption:"chocolate meets espresso",surface:"drizzle",note:"chocolate drizzle",
  layers:[["chocolate",15],["espresso",25],["milk",50],["foam",10]],tag:"Yemen → everywhere",
  story:"The name comes from Mocha, the Yemeni port that dominated the world coffee trade from the 15th to the 18th century. Its beans were known for deep, sometimes chocolatey notes, and “mocha” came to mean coffee paired with chocolate. Turin had its own version, the bicerin, layering espresso, chocolate and cream since the 1700s. Today’s caffè mocha is a latte with chocolate stirred through.",
  fact:"named after a harbour"},
 {id:"latte-macchiato",name:"Latte Macchiato",cup:"tall",fill:.93,recipe:"Milk + espresso + foam",caption:"stripes in a tall glass",surface:"stain",note:"espresso mark",
  layers:[["milk",60],["espresso",15],["foam",25]],tag:"Italy",
  story:"Flip the macchiato around and you get the latte macchiato, “stained milk”: a tall glass of steamed milk with espresso poured in last. The hot coffee is lighter than the milk but heavier than the foam, so it settles in a band between them and gives the drink its stripes. Italians drink it as a gentle morning coffee, and it is especially popular in Germany and Austria.",
  fact:"the milk gets stained, not the coffee"}
];
const LAYER={
  espresso:{label:"espresso",color:"#5d3522"},
  ristretto:{label:"ristretto shot",color:"#46271a"},
  water:{label:"hot water",color:"#cfe1ee"},
  milk:{label:"steamed milk",color:"#e7d0b0"},
  microfoam:{label:"microfoam",color:"#f2e6d3"},
  foam:{label:"milk foam",color:"#faf4ea"},
  chocolate:{label:"chocolate",color:"#4a2417"}
};
const VESSELS={
  demi:{wt:250,wb:168,h:230,curve:.35,handle:"cup",base:16,facets:0},
  mug:{wt:252,wb:238,h:330,curve:0,handle:"mug",base:20,facets:0},
  picS:{wt:250,wb:186,h:250,curve:0,handle:null,base:26,facets:6},
  pic:{wt:262,wb:194,h:300,curve:0,handle:null,base:28,facets:6},
  bowl:{wt:330,wb:170,h:250,curve:.5,handle:"cup",base:16,facets:0},
  picT:{wt:250,wb:188,h:370,curve:0,handle:null,base:30,facets:6},
  tall:{wt:196,wb:168,h:410,curve:0,handle:null,base:36,facets:0}
};
const BG=["bg-sky","bg-blush","bg-paper"];
const P=.2, CX=440, BASE=548, W=720, H=600;
const f=n=>Math.round(n*10)/10;
const pt=p=>f(p[0])+","+f(p[1]);
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seg(pts){let d="";for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
  d+=" C"+pt([p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6])+" "+pt([p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6])+" "+pt(p2)}return d}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}

function paint(d,idx){
  const v=VESSELS[d.cup],R=rng(idx*977+13),top=BASE-v.h,th=7,inB=BASE-v.base,uid="c"+idx;
  const halfW=y=>{const t=Math.min(1,Math.max(0,(BASE-y)/v.h));const k=v.curve?1-Math.pow(1-t,1+3*v.curve):t;return(v.wb+(v.wt-v.wb)*k)/2};
  const N=14,jit=[];for(let i=0;i<=N;i++)jit.push(i===0||i===N?0:(R()-.5)*2.6);

 '</ul><p class="credits">Coffee Guide. Glasses painted in code with SVG watercolour filters. Set in Helvetica and Caveat. Layer shares are typical café ratios and vary by café and country. Origin stories for the americano, flat white and latte are disputed, and the histories here are short summaries.</p><button class="back" type="button" data-go="0">← back to the first sip</button>';

let centers=[],maxS=1;
function measure(){maxS=Math.max(1,track.scrollWidth-track.clientWidth);
  centers=panels.map(p=>Math.min(maxS,Math.max(0,p.offsetLeft+p.offsetWidth/2-track.clientWidth/2)));
  ticks.forEach((t,i)=>{t.style.left=(centers[i+1]/maxS*100)+"%"});update()}
function current(){const s=track.scrollLeft;let best=0,bd=1e9;centers.forEach((c,i)=>{const dd=Math.abs(c-s);if(dd<bd){bd=dd;best=i}});return best}
function goTo(i){i=Math.max(0,Math.min(panels.length-1,i));track.scrollTo({left:centers[i],behavior:reduce?"auto":"smooth"})}
function update(){const fr=track.scrollLeft/maxS;dot.style.left=(Math.min(1,Math.max(0,fr))*100)+"%";
  const c=current();ticks.forEach((t,i)=>t.classList.toggle("on",i+1===c));
  where.innerHTML=c===0?"<b>Start</b>":c===panels.length-1?"<b>Legend</b>":String(c).padStart(2,"0")+" / "+DRINKS.length+" &nbsp;<b>"+DRINKS[c-1].name+"</b>"}
let idle;
track.addEventListener("scroll",()=>{update();clearTimeout(idle);idle=setTimeout(settle,180)},{passive:true});
function settle(){const c=current(),dd=centers[c]-track.scrollLeft;
  if(Math.abs(dd)>2&&Math.abs(dd)<track.clientWidth*.3)track.scrollTo({left:centers[c],behavior:reduce?"auto":"smooth"});
  const id=panels[c].dataset.id;try{history.replaceState(null,"",id?"#"+id:location.pathname+location.search)}catch(e){}
  panels.forEach((p,i)=>{if(i!==c)closeCard(p)})}
track.addEventListener("wheel",e=>{if(e.ctrlKey)return;const dy=e.deltaMode===1?e.deltaY*32:e.deltaMode===2?e.deltaY*track.clientWidth:e.deltaY;
  if(Math.abs(dy)>Math.abs(e.deltaX)){track.scrollLeft+=dy;e.preventDefault()}},{passive:false});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){toggleIndex(false);panels.forEach(closeCard);return}
  if(e.target.closest&&e.target.closest(".index-list"))return;
  const c=current();
  if(["ArrowRight","ArrowDown","PageDown"].includes(e.key)){e.preventDefault();goTo(c+1)}
  else if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){e.preventDefault();goTo(c-1)}
  else if(e.key==="Home"){e.preventDefault();goTo(0)}
  else if(e.key==="End"){e.preventDefault();goTo(panels.length-1)}
});

// cards
let lastPointer="mouse";
function openCard(sec){sec.classList.add("open");sec.querySelector(".cup").setAttribute("aria-expanded","true")}
function closeCard(sec){if(!sec.classList.contains("open"))return;sec.classList.remove("open");const c=sec.querySelector(".cup");if(c)c.setAttribute("aria-expanded","false")}
document.querySelectorAll(".drink").forEach(sec=>{
  const cup=sec.querySelector(".cup"),stage=sec.querySelector(".stage");let t;
  cup.addEventListener("pointerdown",e=>{lastPointer=e.pointerType});
  cup.addEventListener("pointerenter",e=>{if(e.pointerType!=="mouse")return;clearTimeout(t);t=setTimeout(()=>openCard(sec),150)});
  stage.addEventListener("pointerleave",e=>{if(e.pointerType!=="mouse")return;clearTimeout(t);if(document.activeElement!==cup)closeCard(sec)});
  cup.addEventListener("click",e=>{e.stopPropagation();if(lastPointer==="mouse"){openCard(sec)}else{sec.classList.contains("open")?closeCard(sec):openCard(sec)}lastPointer="mouse"});
  cup.addEventListener("focus",()=>{if(cup.matches(":focus-visible"))openCard(sec)});
  cup.addEventListener("blur",()=>{if(!stage.matches(":hover"))closeCard(sec)});
});
document.addEventListener("click",e=>{if(!e.target.closest(".stage"))panels.forEach(closeCard)});

// pour
function pour(p){if(p.done)return;p.done=true;const t0=performance.now(),dur=1500;
  (function step(now){const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);p.rect.setAttribute("y",(p.bottom+(p.top-p.bottom)*e).toFixed(1));
    if(k<1)requestAnimationFrame(step);else p.labels.style.opacity=1})(t0)}
if(!reduce&&"IntersectionObserver" in window){
  pours.forEach(p=>{p.rect.setAttribute("y",p.bottom);p.labels.style.opacity=0});
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){const p=pours.find(q=>q.sec===en.target);if(p)pour(p)}}),{root:track,threshold:.35});
  pours.forEach(p=>io.observe(p.sec));
}
